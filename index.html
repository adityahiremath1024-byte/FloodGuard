<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FloodGuard – Choose Portal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>
<canvas id="fx"></canvas>
<main class="ui">
  <div class="brand">
    <svg viewBox="0 0 48 52" aria-hidden="true">
      <path d="M24 2 44 9v16c0 12-8 21-20 25C12 46 4 37 4 25V9z" fill="#1f4a36"/>
      <path d="M24 13 14 21v8h20v-8z" fill="#fff"/>
      <path d="M21 29v-6h6v6z" fill="#1f4a36"/>
      <path d="M10 36q3.5-3 7 0t7 0 7 0 7 0" fill="none" stroke="#8fd1a8" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M13 41q3-2.5 6 0t6 0 6 0 4 0" fill="none" stroke="#8fd1a8" stroke-width="2" stroke-linecap="round" opacity=".7"/>
    </svg>
    <h1>FloodGuard</h1>
  </div>
  <p class="tag">Know the risk, find the safe way, stay prepared</p>
  <h2 class="choose">Choose your portal</h2>
  <div class="cards">
    <section class="card">
      <div class="ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="#1f4a45" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
          <path d="M3 11 12 3l9 8"/>
          <path d="M5 10v10h8"/>
          <path d="M18 14l4 7h-8z" fill="#1f4a45"/>
          <path d="M18 17v2" stroke="#fff"/>
        </svg>
      </div>
      <h2>Citizen Portal</h2>
      <p>Get alerts, check flood status, find safe routes and shelters</p>
      <a class="btn" href="citizen-login.html">Login</a>
    </section>
    <section class="card eoc">
      <div class="ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="#8a5f00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 17a6 6 0 0 1 12 0z" fill="#d9a94c"/>
          <path d="M4 21h16"/>
          <path d="M12 4v2M5 7l1.5 1.5M19 7l-1.5 1.5"/>
        </svg>
      </div>
      <h2>Emergency Operation Center</h2>
      <p>Monitor, coordinate and manage emergency response</p>
      <a class="btn" href="eoc-login.html">Login</a>
    </section>
  </div>
</main>

<script src="earth.js"></script>
</body>
</html>
